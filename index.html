<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ວາຣີ — ລະບົບບຸກຄະລາກອນ ແລະ ບັນຊີ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;600;700&family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brand:#00AB8F;--brand-dk:#007A66;--cyan:#1AC8DB;--navy:#00695A;--teal:#007A66;--sky:#E6F7F4;--mint:#E3F8FA;--line:#D9E2EC;--soft:#F5F8FB;--grey:#5F6B7A;--red:#B03A2E;--ok:#1E7E4F;--warn:#9A6700;--bg:#FFFFFF;--fg:#1F2933}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Lao Looped','Noto Sans Lao','Phetsarath OT',system-ui,sans-serif;background:var(--soft);color:var(--fg);font-size:16px;line-height:1.75}
p{margin:0 0 12px}
header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:34px;display:block}
header h1{font-size:18px;font-weight:700;margin:0;flex:1}
header .who{font-size:13px;opacity:.9}
button{font-family:inherit;font-size:15px;line-height:1.6;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--brand-dk);color:#fff}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.green{background:var(--ok)} button.red{background:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font-family:inherit;font-size:16px;line-height:1.6;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
nav{display:flex;gap:4px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:transparent;color:var(--grey);border-radius:8px;white-space:nowrap}
nav button.on{background:var(--sky);color:var(--navy);font-weight:700}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:18px;line-height:1.6;margin:0 0 12px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--sky);border-radius:10px;padding:12px}
.stat .l{font-size:12px;color:var(--grey)} .stat .v{font-size:20px;font-weight:700;color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6;background:#fff}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);color:var(--grey);font-weight:600;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--soft)}
td input{width:90px;padding:4px 6px;text-align:right}
td input[type=checkbox]{width:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.p-ຮ່າງ{background:#EEF2F6;color:var(--grey)} .p-ຄິດໄລ່ແລ້ວ{background:#FFF4D6;color:var(--warn)}
.p-ອະນຸມັດ{background:var(--mint);color:var(--teal)} .p-ລົງບັນຊີແລ້ວ{background:#DDF3E6;color:var(--ok)} .p-ນຳເຂົ້າ{background:#E8E3F7;color:#5B3FA8}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.msg.err{background:#FBE9E7;color:var(--red)} .msg.ok{background:#DDF3E6;color:var(--ok)} .msg.info{background:var(--sky);color:var(--navy)}
.slip{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slip table td:first-child{white-space:normal}
.net{background:var(--brand-dk);color:#fff;border-radius:10px;padding:14px;display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-top:12px}
.muted{color:var(--grey);font-size:14px}
#login{max-width:420px;margin:48px auto}
#login .logo{display:block;height:64px;margin:4px auto 16px}
.hide{display:none!important}
@media (max-width:640px){.slip{grid-template-columns:1fr} main{padding:12px} header h1{font-size:16px}}
@media print{header,nav,.noprint{display:none!important} body{background:#fff} .card{border:0}}
</style>
</head>

    <h2>ເຂົ້າສູ່ລະບົບ</h2>
    <p>ໃສ່ອີເມວຂອງທ່ານ ແລ້ວກົດປຸ່ມ.<br>ທ່ານຈະໄດ້ຮັບອີເມວທີ່ມີລິ້ງ — ກົດລິ້ງນັ້ນເພື່ອເຂົ້າໃຊ້.</p>
    <p class="muted">ໃຊ້ອີເມວດຽວກັບທີ່ແຈ້ງໄວ້ກັບພະແນກບຸກຄະລາກອນ</p>
    <div class="row"><input id="email" type="email" placeholder="ຕົວຢ່າງ: name@gmail.com" style="flex:1" autocomplete="email"></div>
    <button id="btnLogin" style="width:100%">ຮັບລິ້ງເຂົ້າລະບົບ</button>
  </section>

  <section id="v-me" class="hide"></section>
  <section id="v-pay" class="hide"></section>
  <section id="v-acc" class="hide"></section>
  <section id="v-emp" class="hide"></section>
</main>

<script>
/* ======== ຕັ້ງຄ່າ (ໃສ່ຄັ້ງດຽວ) ======== */
const SUPABASE_URL = 'https://xevypghtewmldcpukmix.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0vCSiODRf5y1YA8iqhP07A_LifF26Jl';   // Project Settings → API Keys → Publishable key (ເປີດເຜີຍໄດ້ ປອດໄພ)
/* ===================================== */

if (!window.supabase) { document.querySelector('main').innerHTML = '<div class="card msg err">ເຊື່ອມຕໍ່ອິນເຕີເນັດບໍ່ໄດ້ — ກວດອິນເຕີເນັດ ແລ້ວໂຫຼດໜ້າໃໝ່</div>'; throw new Error('no supabase'); }
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'vari' } });
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kip = n => Math.round(Number(n || 0)).toLocaleString('en-US');
const BR = { HO: 'ສຳນັກງານໃຫຍ່', FAC: 'ໂຮງງານ' };
let ME = null;            // ແຖວພະນັກງານຂອງຜູ້ເຂົ້າລະບົບ
let ROLE = null;

function flash(text, kind = 'info') {
  $('#flash').innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : '';
  if (text) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function errText(e) { return (e && (e.message || e.error_description)) || String(e); }
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }

/* ---------- ເຂົ້າ/ອອກລະບົບ ---------- */
$('#btnLogin').onclick = async () => {
  const email = $('#email').value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return flash('ອີເມວບໍ່ຖືກຕ້ອງ — ກວດອີກຄັ້ງ', 'err');
  $('#btnLogin').disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  $('#btnLogin').disabled = false;
  if (error) return flash('ສົ່ງລິ້ງບໍ່ສຳເລັດ: ' + errText(error), 'err');
  flash('ສົ່ງແລ້ວ! ເປີດອີເມວ ' + email + ' ແລ້ວກົດລິ້ງ. ຖ້າບໍ່ເຫັນ ໃຫ້ເບິ່ງໃນ Spam', 'ok');
};
$('#btnOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };

sb.auth.onAuthStateChange((_ev, session) => { if (session && !ME) start(session); });
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session); else $('#login').classList.remove('hide');
})();

async function start(session) {
  const email = session.user.email.toLowerCase();
  try {
    const rows = await q(sb.from('employees').select('*').ilike('email', email).limit(1));
    if (!rows.length) {
      $('#login').classList.add('hide'); $('#btnOut').classList.remove('hide');
      return flash('ອີເມວ ' + email + ' ຍັງບໍ່ມີໃນລະບົບ — ກະລຸນາແຈ້ງພະແນກບຸກຄະລາກອນ', 'err');
    }
    ME = rows[0]; ROLE = ME.access_role;
  } catch (e) { return flash('ໂຫຼດຂໍ້ມູນບໍ່ໄດ້: ' + errText(e), 'err'); }
  $('#login').classList.add('hide'); $('#btnOut').classList.remove('hide');
  $('#who').textContent = ME.full_name + ' · ' + ROLE;
  const tabs = [['me', 'ໜ້າຂອງຂ້ອຍ']];
  if (['ຜູ້ບໍລິຫານ', 'ບັນຊີ', 'ຜູ້ຈັດການໂຮງງານ'].includes(ROLE)) tabs.push(['pay', 'ເງິນເດືອນ']);
  if (['ຜູ້ບໍລິຫານ', 'ບັນຊີ'].includes(ROLE)) tabs.push(['acc', 'ບັນຊີ'], ['emp', 'ພະນັກງານ']);
  const nav = $('#nav'); nav.classList.remove('hide');
  nav.innerHTML = tabs.map(([k, t]) => `<button data-k="${k}">${t}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.k));
  show('me');
}

function show(k) {
  flash('');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  ['me', 'pay', 'acc', 'emp'].forEach(x => $('#v-' + x).classList.toggle('hide', x !== k));
  ({ me: viewMe, pay: viewPay, acc: viewAcc, emp: viewEmp })[k]();
}

/* ---------- ໜ້າຂອງຂ້ອຍ ---------- */
async function viewMe() {
  const el = $('#v-me'); el.innerHTML = '<div class="card muted">ກຳລັງໂຫຼດ…</div>';
  try {
    const [jobs, leave, lines] = await Promise.all([
      ME.job_code ? q(sb.from('jobs').select('*').eq('job_code', ME.job_code)) : [],
      q(sb.from('leave_summary').select('*').eq('emp_code', ME.code).order('year', { ascending: false }).limit(1)),
      q(sb.from('payroll_lines').select('*, payroll_periods(month, branch, status)').eq('emp_code', ME.code))
    ]);
    const job = jobs[0], lv = leave[0];
    lines.sort((a, b) => b.payroll_periods.month.localeCompare(a.payroll_periods.month));
    const shown = lines.filter(l => l.payroll_periods.status !== 'ຮ່າງ' && l.payroll_periods.status !== 'ຄິດໄລ່ແລ້ວ');
    el.innerHTML = `
      <div class="card">
        <h2>${esc(job ? job.title : (ME.department || ''))}</h2>
        <div class="muted">${esc(ME.full_name)} · ${esc(ME.code)} · ${esc(BR[ME.branch])} / ${esc(ME.department || '')}${job && job.reports_to ? ' · ລາຍງານຕໍ່: ' + esc(job.reports_to) : ''}</div>
      </div>
      <div class="card"><h2>ວັນລາພັກ ${lv ? lv.year : ''}</h2>
        ${lv ? `<div class="grid">
          <div class="stat"><div class="l">ສິດປະຈຳປີ</div><div class="v">${lv.entitled ?? '—'} ມື້</div></div>
          <div class="stat"><div class="l">ໃຊ້ແລ້ວ</div><div class="v">${lv.used_annual ?? 0} ມື້</div></div>
          <div class="stat"><div class="l">ເຫຼືອ</div><div class="v">${lv.remaining ?? '—'} ມື້</div></div>
          <div class="stat"><div class="l">ລາປ່ວຍ / ລາກິດ</div><div class="v">${lv.sick ?? 0} / ${lv.unpaid ?? 0}</div></div></div>` : '<div class="muted">ຍັງບໍ່ມີຂໍ້ມູນ</div>'}
      </div>
      <div class="card"><h2>ສະລິບເງິນເດືອນ</h2>
        ${shown.length ? `<div class="row noprint"><select id="slipSel">${shown.map((l, i) => `<option value="${i}">${l.payroll_periods.month}</option>`).join('')}</select>
          <button class="ghost" onclick="window.print()">ພິມ / ບັນທຶກ PDF</button></div><div id="slipBox"></div>` : '<div class="muted">ຍັງບໍ່ມີສະລິບ</div>'}
      </div>
      ${job ? `<div class="card"><h2>ໜ້າທີ່ຮັບຜິດຊອບ</h2>
        <div style="white-space:pre-wrap">${esc(job.duties || '')}</div>
        <h2 style="margin-top:16px">ຕົວຊີ້ວັດຜົນງານ</h2><div style="white-space:pre-wrap">${esc(job.kpi || '')}</div></div>` : ''}
      <p class="muted">🔒 ຂໍ້ມູນນີ້ເປັນຄວາມລັບ ເຫັນໄດ້ສະເພາະທ່ານ — ຫ້າມສົ່ງຕໍ່ ຫຼື ຖ່າຍຮູບໃຫ້ຄົນອື່ນ.<br>ສົງໄສເລື່ອງເງິນເດືອນ: ຖາມພະແນກການເງິນ · ເລື່ອງວັນລາ ແລະ ໜ້າວຽກ: ຖາມພະແນກບຸກຄະລາກອນ</p>`;
    if (shown.length) { const sel = $('#slipSel'); const draw = () => $('#slipBox').innerHTML = slipHtml(shown[sel.value]); sel.onchange = draw; draw(); }
  } catch (e) { el.innerHTML = ''; flash('ໂຫຼດບໍ່ໄດ້: ' + errText(e), 'err'); }
}

function slipHtml(l) {
  const inc = [['ເງິນເດືອນພື້ນຖານ', l.base_salary], ['ເງິນອັດຕາກິນ', l.meal_allowance], ['ເງິນໂອທີ', l.ot_pay], ['ໂອທີວັນພັກລັດຖະການ', l.holiday_ot],
    ['ເງິນຂະຫຍັນ', l.diligence_pay], ['KPI', l.kpi], ['ເງິນຍອດຜະລິດ', l.production_pay], ['ໂບນັດ', l.bonus], ['ເງິນອື່ນໆ', l.other_income]].filter(x => Number(x[1]));
  const ded = [['ຂາດວຽກ', l.ded_absence], ['ອັດຕາກິນ (ມື້ຂາດ)', l.ded_meal], ['ມາຊ້າ', l.ded_late], ['ລືມສະແກນ', l.ded_scan],
    ['ອປສ', l.ded_social_security], ['ຫັກອື່ນໆ', l.ded_other], ['ອາກອນເງິນເດືອນ', l.income_tax], ['ເງິນເບີກລ່ວງໜ້າ', l.advance],
    ['ຊົດເຊີຍຄ່າເສຍຫາຍ', l.compensation], ['ປະກັນຄວາມຊື່ສັດ', l.fidelity_insurance], ['ຫັກອື່ນໆ ຫຼັງອາກອນ', l.other_after_tax]].filter(x => Number(x[1]));
  if (Number(l.commission)) inc.push(['ຄ່າຄອມລູກຄ້າໃໝ່', l.commission]);
  const tbl = (rows, title) => `<div class="tw"><table><tr><th>${title}</th><th class="n">ກີບ</th></tr>
    ${rows.length ? rows.map(r => `<tr><td>${r[0]}</td><td class="n">${kip(r[1])}</td></tr>`).join('') : '<tr><td>ບໍ່ມີ</td><td class="n">-</td></tr>'}
    <tr class="tot"><td>ລວມ</td><td class="n">${kip(rows.reduce((s, r) => s + Number(r[1]), 0))}</td></tr></table></div>`;
  return `<div class="muted" style="margin-bottom:8px">ເດືອນ ${l.payroll_periods.month} · ມື້ເຮັດວຽກ ${l.days_worked ?? '—'} ມື້</div>
    <div class="slip">${tbl(inc, 'ລາຍຮັບ')}${tbl(ded, 'ລາຍການຫັກ')}</div>
    <div class="net"><span>ເງິນໄດ້ຮັບສຸດທິ</span><span>${kip(l.net_pay)} ກີບ</span></div>`;
}

/* ---------- ເງິນເດືອນ ---------- */
const INPUTS = [['days_absent', 'ຂາດວຽກ (ມື້)'], ['late_minutes', 'ມາຊ້າລວມ (ນາທີ) — ສຳນັກງານໃຫຍ່'], ['late_le5_count', 'ມາຊ້າ ບໍ່ເກີນ 5 ນາທີ (ຄັ້ງ) — ໂຮງງານ'], ['late_gt5_count', 'ມາຊ້າ ເກີນ 5 ນາທີ (ຄັ້ງ) — ໂຮງງານ'],
  ['missed_scan', 'ລືມສະແກນ (ຄັ້ງ)'], ['ot_hours', 'ໂອທີ (ຊົ່ວໂມງ)'], ['holiday_ot', 'ໂອທີວັນພັກ (ກີບ)'], ['diligence', 'ໄດ້ເງິນຂະຫຍັນ'], ['kpi', 'KPI'],
  ['bonus', 'ໂບນັດ'], ['other_income', 'ເງິນອື່ນໆ'], ['other_deduction', 'ຫັກອື່ນໆ (ກ່ອນອາກອນ)'], ['commission', 'ຄ່າຄອມ'],
  ['advance', 'ເບີກລ່ວງໜ້າ'], ['compensation', 'ຊົດເຊີຍ'], ['fidelity_insurance', 'ປະກັນຊື່ສັດ'], ['other_after_tax', 'ຫັກອື່ນໆ (ຫຼັງອາກອນ)']];
let PER = null;

async function viewPay() {
  const el = $('#v-pay'); el.innerHTML = '<div class="card muted">ກຳລັງໂຫຼດ…</div>';
  try {
    const pers = await q(sb.from('payroll_periods').select('*').order('month', { ascending: false }).order('branch'));
    const isMgr = ['ຜູ້ບໍລິຫານ', 'ບັນຊີ'].includes(ROLE);
    el.innerHTML = `<div class="card"><h2>ເງິນເດືອນແຕ່ລະເດືອນ</h2>
      ${isMgr ? `<div class="row noprint"><input id="newMonth" type="month"> <select id="newBr"><option value="HO">ສຳນັກງານໃຫຍ່</option><option value="FAC">ໂຮງງານ</option></select>
        <button id="btnNewPer">+ ເພີ່ມເດືອນໃໝ່</button></div>` : ''}
      <div class="tw"><table><tr><th>ເດືອນ</th><th>ສາຂາ</th><th>ສະຖານະ</th><th>ອະນຸມັດໂດຍ</th><th></th></tr>
      ${pers.map(p => `<tr><td>${p.month}</td><td>${BR[p.branch]}</td><td><span class="pill p-${p.status}">${p.status}</span></td>
        <td class="muted">${esc(p.approved_by || '')}</td><td><button class="ghost" data-id="${p.id}">ເປີດ</button></td></tr>`).join('')}</table></div></div>
      <div id="perBox"></div>`;
    el.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => openPeriod(+b.dataset.id));
    if (isMgr) $('#btnNewPer').onclick = async () => {
      const m = $('#newMonth').value, br = $('#newBr').value;
      if (!m) return flash('ເລືອກເດືອນກ່ອນ', 'err');
      try { const r = await q(sb.from('payroll_periods').insert({ month: m, branch: br }).select()); flash('ສ້າງງວດ ' + m + ' ' + BR[br] + ' ແລ້ວ', 'ok'); await viewPay(); openPeriod(r[0].id); }
      catch (e) { flash('ສ້າງບໍ່ໄດ້: ' + errText(e), 'err'); }
    };
  } catch (e) { el.innerHTML = ''; flash('ໂຫຼດບໍ່ໄດ້: ' + errText(e), 'err'); }
}

async function openPeriod(id) {
  const box = $('#perBox'); box.innerHTML = '<div class="card muted">ກຳລັງໂຫຼດ…</div>';
  try {
    PER = (await q(sb.from('payroll_periods').select('*').eq('id', id)))[0];
    const editable = ['ຮ່າງ', 'ຄິດໄລ່ແລ້ວ'].includes(PER.status);
    const [emps, inputs, lines, checks] = await Promise.all([
      q(sb.from('employees').select('code, full_name, department').eq('branch', PER.branch).neq('status', 'ລາອອກ').order('code')),
      q(sb.from('payroll_inputs').select('*').eq('period_id', id)),
      q(sb.from('payroll_lines').select('*').eq('period_id', id).order('emp_code')),
      q(sb.from('payroll_check').select('*').eq('month', PER.month).eq('branch', PER.branch))
    ]);
    const inp = Object.fromEntries(inputs.map(r => [r.emp_code, r]));
    const tot = k => lines.reduce((s, l) => s + Number(l[k] || 0), 0);
    let html = `<div class="card"><h2>${PER.month} · ${BR[PER.branch]} <span class="pill p-${PER.status}">${PER.status}</span></h2>`;
    if (lines.length) html += `<div class="grid" style="margin-bottom:12px">
      <div class="stat"><div class="l">ຈຳນວນຄົນ</div><div class="v">${lines.length}</div></div>
      <div class="stat"><div class="l">ລວມລາຍຮັບ (ກີບ)</div><div class="v">${kip(tot('gross'))}</div></div>
      <div class="stat"><div class="l">ອາກອນ (ກີບ)</div><div class="v">${kip(tot('income_tax'))}</div></div>
      <div class="stat"><div class="l">ຈ່າຍສຸດທິ (ກີບ)</div><div class="v">${kip(tot('net_pay'))}</div></div></div>`;
    if (checks.length) html += `<div class="msg err">⚠ ມີ ${checks.length} ແຖວທີ່ຕ້ອງກວດ: ${checks.map(c => esc(c.emp_code + ' ' + (c.emp_name || ''))).join(', ')}</div>`;
    html += `<div class="row noprint">`;
    if (editable) html += `<button id="btnSave">ບັນທຶກ</button><button id="btnCalc">ຄິດໄລ່ເງິນເດືອນ</button>`;
    if (PER.status === 'ຄິດໄລ່ແລ້ວ' && ROLE === 'ຜູ້ບໍລິຫານ') html += `<button class="green" id="btnApprove">ອະນຸມັດ</button>`;
    if (PER.status === 'ອະນຸມັດ' && ['ຜູ້ບໍລິຫານ', 'ບັນຊີ'].includes(ROLE)) html += `<input type="date" id="postDate"><button class="green" id="btnPost">ລົງບັນຊີ</button>`;
    if (lines.length) html += `<button class="ghost" id="btnCsv">ດາວໂຫຼດ CSV</button>`;
    html += `</div>`;
    if (editable) {
      html += `<h2>ປ້ອນຂໍ້ມູນປະຈຳເດືອນ</h2><p class="muted">ປ້ອນສະເພາະຄົນທີ່ມີ — ຊ່ອງຫວ່າງ = 0. ປ້ອນແລ້ວກົດ "ບັນທຶກ" ຫຼື "ຄິດໄລ່ເງິນເດືອນ"</p><div class="tw" style="max-height:60vh"><table id="inTbl"><tr><th>ລະຫັດ</th><th>ຊື່</th>${INPUTS.map(x => `<th class="n">${x[1]}</th>`).join('')}</tr>
        ${emps.map(e => `<tr data-code="${esc(e.code)}"><td>${esc(e.code)}</td><td>${esc(e.full_name)}</td>${INPUTS.map(([k]) => k === 'diligence'
          ? `<td><input type="checkbox" data-k="${k}" ${inp[e.code]?.[k] ? 'checked' : ''}></td>`
          : `<td><input type="number" step="any" min="0" data-k="${k}" value="${Number(inp[e.code]?.[k] || 0) || ''}"></td>`).join('')}</tr>`).join('')}
        </table></div>`;
    }
    if (lines.length) {
      const C = [['emp_code', 'ລະຫັດ'], ['emp_name', 'ຊື່'], ['gross', 'ລວມລາຍຮັບ'], ['total_deduction', 'ລວມຫັກ'], ['taxable', 'ຄິດອາກອນ'], ['income_tax', 'ອາກອນ'],
        ['commission', 'ຄ່າຄອມ'], ['advance', 'ເບີກ'], ['compensation', 'ຊົດເຊີຍ'], ['fidelity_insurance', 'ປະກັນ'], ['other_after_tax', 'ຫັກອື່ນ'], ['net_pay', 'ສຸດທິ'], ['check_note', 'ກວດ']];
      const num = k => !['emp_code', 'emp_name', 'check_note'].includes(k);
      html += `<h2 style="margin-top:16px">ຜົນຄິດໄລ່</h2><div class="tw" style="max-height:60vh"><table><tr>${C.map(([k, t]) => `<th class="${num(k) ? 'n' : ''}">${t}</th>`).join('')}</tr>
        ${lines.map(l => `<tr>${C.map(([k]) => `<td class="${num(k) ? 'n' : ''}">${num(k) ? kip(l[k]) : esc(l[k] ?? '')}</td>`).join('')}</tr>`).join('')}
        <tr class="tot">${C.map(([k], i) => `<td class="${num(k) ? 'n' : ''}">${i === 0 ? 'ລວມ' : num(k) ? kip(tot(k)) : ''}</td>`).join('')}</tr></table></div>`;
    }
    box.innerHTML = html + '</div>';

    const save = async () => {
      const rows = [...document.querySelectorAll('#inTbl tr[data-code]')].map(tr => {
        const r = { period_id: id, emp_code: tr.dataset.code };
        tr.querySelectorAll('input').forEach(i => r[i.dataset.k] = i.type === 'checkbox' ? i.checked : (Number(i.value) || 0));
        return r;
      });
      await q(sb.from('payroll_inputs').upsert(rows, { onConflict: 'period_id,emp_code' }));
    };
    const act = (sel, fn, okMsg) => { const b = $(sel); if (b) b.onclick = async () => {
      b.disabled = true;
      try { await fn(); flash(okMsg, 'ok'); await viewPay(); await openPeriod(id); }
      catch (e) { flash(errText(e), 'err'); b.disabled = false; } }; };
    act('#btnSave', save, 'ບັນທຶກແລ້ວ');
    act('#btnCalc', async () => { await save(); await q(sb.rpc('run_calc', { p_period: id })); }, 'ຄິດໄລ່ແລ້ວ — ກວດຕົວເລກໃຫ້ຖືກ ແລ້ວແຈ້ງຜູ້ບໍລິຫານອະນຸມັດ');
    act('#btnApprove', async () => {
      if (!confirm('ອະນຸມັດງວດ ' + PER.month + ' ' + BR[PER.branch] + '?\nຈ່າຍສຸດທິ ' + kip(tot('net_pay')) + ' ກີບ\nຫຼັງອະນຸມັດ ແກ້ໄຂບໍ່ໄດ້')) throw new Error('ຍົກເລີກ');
      await q(sb.rpc('run_approve', { p_period: id }));
    }, 'ອະນຸມັດແລ້ວ');
    act('#btnPost', async () => {
      const d = $('#postDate').value; if (!d) throw new Error('ເລືອກວັນທີລົງບັນຊີກ່ອນ');
      if (!confirm('ລົງບັນຊີເງິນເດືອນ ' + PER.month + ' ວັນທີ ' + d + '?\nລົງໄດ້ຄັ້ງດຽວ')) throw new Error('ຍົກເລີກ');
      await q(sb.rpc('run_post', { p_period: id, p_date: d }));
    }, 'ລົງບັນຊີແລ້ວ — ເບິ່ງໄດ້ທີ່ແຖບ ບັນຊີ');
    const csv = $('#btnCsv'); if (csv) csv.onclick = () => {
      const keys = Object.keys(lines[0]);
      const body = [keys.join(','), ...lines.map(l => keys.map(k => '"' + String(l[k] ?? '').replace(/"/g, '""') + '"').join(','))].join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + body], { type: 'text/csv' }));
      a.download = `payroll_${PER.month}_${PER.branch}.csv`; a.click();
    };
  } catch (e) { box.innerHTML = ''; flash('ໂຫຼດບໍ່ໄດ້: ' + errText(e), 'err'); }
}

  try {
    const [tb, je] = await Promise.all([

    ]);
    const used = tb.filter(r => Number(r.debit) || Number(r.credit));

      ${je.length ? je.map(e => `<div style="margin-bottom:12px"><b>${e.entry_date}</b> · ${esc(e.description)} <span class="muted">(${esc(e.created_by || '')})</span>
        <div class="tw"><table><tr><th>ບັນຊີ</th><th>ລາຍລະອຽດ</th><th class="n">ໜີ້</th><th class="n">ມີ</th></tr>
        ${e.journal_lines.map(l => `<tr><td>${esc(l.account_code)}</td><td>${esc(l.memo || '')}</td><td class="n">${Number(l.debit) ? kip(l.debit) : ''}</td><td class="n">${Number(l.credit) ? kip(l.credit) : ''}</td></tr>`).join('')}

  } catch (e) { el.innerHTML = ''; flash('ໂຫຼດບໍ່ໄດ້: ' + errText(e), 'err'); }
}

      <div class="tw" style="max-height:65vh"><table id="empTbl"><tr><th>ລະຫັດ</th><th>ຊື່</th><th>ສາຂາ</th><th>ຝ່າຍ</th><th>ສະຖານະ</th><th>ອີເມວ</th><th>ສິດ</th><th class="n">ເງິນເດືອນພື້ນຖານ</th><th></th></tr>
      ${emps.map(e => `<tr data-code="${esc(e.code)}" data-left="${e.status === 'ລາອອກ'}"><td>${esc(e.code)}</td><td>${esc(e.full_name)}</td><td>${BR[e.branch]}</td>
        <td>${esc(ccn[e.cost_center] || '')}</td><td>${esc(e.status)}</td>
        <td><input type="email" value="${esc(e.email || '')}" style="width:210px;text-align:left" data-f="email"></td>
        <td><select data-f="access_role">${ROLES.map(r => `<option ${r === e.access_role ? 'selected' : ''}>${r}</option>`).join('')}</select></td>
        <td class="n">${kip(e.base_salary)}</td><td><button class="ghost" data-save>ບັນທຶກ</button></td></tr>`).join('')}</table></div></div>`;
    const filter = () => { const t = $('#empQ').value.toLowerCase(), sl = $('#empLeft').checked;
      document.querySelectorAll('#empTbl tr[data-code]').forEach(tr => tr.classList.toggle('hide', (!sl && tr.dataset.left === 'true') || !tr.textContent.toLowerCase().includes(t))); };
    $('#empQ').oninput = filter; $('#empLeft').onchange = filter; filter();
    el.querySelectorAll('button[data-save]').forEach(b => b.onclick = async () => {
      const tr = b.closest('tr'), email = tr.querySelector('[data-f=email]').value.trim().toLowerCase() || null;
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return flash('ອີເມວບໍ່ຖືກຮູບແບບ', 'err');
      try { await q(sb.from('employees').update({ email, access_role: tr.querySelector('[data-f=access_role]').value, updated_at: new Date().toISOString() }).eq('code', tr.dataset.code));
        flash('ບັນທຶກ ' + tr.dataset.code + ' ແລ້ວ', 'ok'); }
      catch (e) { flash('ບັນທຶກບໍ່ໄດ້: ' + errText(e), 'err'); }
    });
  } catch (e) { el.innerHTML = ''; flash('ໂຫຼດບໍ່ໄດ້: ' + errText(e), 'err'); }
}
</script>
</body>
</html>
